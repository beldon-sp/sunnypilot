name: 打包并发布到 CNB

on:
  push:
    branches: [ byd-tici ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to strip and publish
        required: true
        type: choice
        options: [ byd-tici ]
      full_push:
        description: 强制全量推送（重置 CNB 镜像历史）
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_tinygrad.pkl

jobs:
  publish:
    name: byd-tici → CNB
    runs-on: ubuntu-latest
    concurrency:
      group: release-cnb
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4 # checkout version > v4 breaks nightly release script
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_branch || github.ref_name }}
          submodules: true
          fetch-depth: 0

      - run: ./tools/op.sh setup

      # ── 常规精简分支（不含大模型）──
      - name: 构建精简源码树
        env:
          # 不设置 BRANCH，build_stripped.sh 就不会推送到 GitHub，只产出精简树
          # 固定 TARGET_DIR（脚本未设置时会 mktemp 随机目录），供下一步 CNB 发布复用精简树。
          # 必须放在 runner.temp（repo 工作区外）：脚本里的 git clean -xdff 会清掉 repo 内的未跟踪目录。
          TARGET_DIR: ${{ runner.temp }}/stripped
        run: ./tools/release/build_stripped.sh

      - name: 同步发布到 CNB 镜像仓库
        env:
          # 不推 GitHub，CNB 镜像分支固定叫 byd-tici
          BRANCH: byd-tici
          TARGET_DIR: ${{ runner.temp }}/stripped
          CNB_REPO: cnb.cool/beldon-op/sunnypilot.git
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          FORCE_FULL_PUSH: ${{ github.event.inputs.full_push }}
        run: |
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::warning::CNB_TOKEN secret 未配置，跳过 CNB 镜像发布"
            exit 0
          fi
          cd "$TARGET_DIR"
          # CNB https 推送认证：用户名固定为 cnb，token 作为密码
          git remote add cnb "https://cnb:${CNB_TOKEN}@${CNB_REPO}"

          # 增量推送：build_stripped.sh 产出的是孤立单提交，与 CNB 上现有分支无共同
          # 历史，直接 push 每次都会全量上传整棵树。这里以 CNB 当前 tip 为父提交，
          # 用 commit-tree 重新生成携带同一棵树（HEAD^{tree}）的提交，推送便只包含
          # 本次有变化的对象。CNB 分支不存在（首次发布）或拉取失败时回退全量推送。
          force_arg="-f"
          if [ "$FORCE_FULL_PUSH" != "true" ] \
              && git fetch --depth=1 cnb "$BRANCH" \
              && prev=$(git rev-parse -q --verify FETCH_HEAD); then
            new=$(git commit-tree 'HEAD^{tree}' -p "$prev" -m "$(git log -1 --format=%B)")
            git update-ref refs/heads/tmp "$new"
            echo "增量推送: 挂到 CNB 现有 tip ${prev:0:12} 之下"
            force_arg=""
          else
            echo "全量推送: CNB 上暂无 $BRANCH 或指定强制全量"
          fi

          # 与 build_stripped.sh 推 GitHub 的参数一致：精简树无 LFS 对象，跳过 LFS 钩子并关闭压缩
          if ! GIT_LFS_SKIP_PUSH=1 git -c pack.window=0 -c pack.depth=0 -c pack.compression=0 \
              push $force_arg cnb "tmp:${BRANCH}" --no-verify; then
            # 增量推送失败（如 fetch 之后远端 tip 又变了）：全量兜底，下次会自动重新挂链
            echo "::warning::增量推送失败，回退全量推送"
            GIT_LFS_SKIP_PUSH=1 git -c pack.window=0 -c pack.depth=0 -c pack.compression=0 \
              push -f cnb "tmp:${BRANCH}" --no-verify
          fi
          echo "CNB 镜像已更新: https://${CNB_REPO%.git}/-/tree/${BRANCH}"

      # ── chestnut 精简分支（含大模型）──
      # 覆盖 lfs.fetchexclude，把大模型真实文件拉到工作区，供 build_stripped.sh 拷贝
#      - name: 构建精简源码树（chestnut 含大模型）
#        env:
#          INCLUDE_BIG_MODEL: 1
#          TARGET_DIR: ${{ runner.temp }}/stripped-chestnut
#        run: |
#          git lfs pull --exclude=''
#          ./tools/release/build_stripped.sh
